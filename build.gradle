plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://jitpack.io/" }
    maven { url "https://maven.nucleoid.xyz" }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    flatDir {
        dirs 'libs'
    }
}

loom {
    splitEnvironmentSourceSets()
}

fabricApi {
    configureDataGeneration() {
        createSourceSet = true
        modId = "frostiful-datagen"
        client = true
    }

    configureTests {
        createSourceSet = true
        modId = "frostiful-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {

    //// Required Dependencies ////

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    implementation "com.github.TheDeathlyCow:thermoo:v${project.thermoo_version}"

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"

    //// Optional Dependencies ////
    compileOnly("maven.modrinth:colorful-hearts:${project.colorful_hearts_version}") { transitive = false }

    implementation("eu.pb4:trinkets:${trinkets_version}")

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:3.+"
    gametestImplementation "org.mockito:mockito-core:3.+"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.1 upwards uses Java 25.
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

test {
    useJUnitPlatform()
}

loom {
    mods {
        "frostiful" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file("src/main/resources/frostiful.accesswidener")
    runs {
        testmodClient {
            client()
            ideConfigGenerated project.rootProject == project
            name = "Testmod Client"
            source sourceSets.gametest
        }
        testmodServer {
            server()
            ideConfigGenerated project.rootProject == project
            name = "Testmod Server"
            source sourceSets.gametest
        }
        updateStructures {
            server()
            name = "Update Structures"

            vmArg("-Dfrostiful.update-structures")
            runDir "run/structure_update"
        }
    }
}

publishMods {
    changelog = file("changelogs/${mod_version}.md").text
    type = STABLE

    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    displayName = "Frostiful ${mod_version}"

    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "715248"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        javaVersions.add(JavaVersion.VERSION_25)

        clientRequired = true
        serverRequired = true

        requires("fabric-api", "cardinal-components-api", "thermoo", "yacl")

        optional("thermoo-patches", "scorchful", "modmenu")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "Ae6qoBj3"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        requires("fabric-api", "cardinal-components-api", "thermoo", "yacl")

        optional("thermoo-patches", "scorchful", "modmenu", "trinkets-updated")
    }
}
