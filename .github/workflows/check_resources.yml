name: Check Resources

on:
  push:
    paths:
      - 'src/datagen/java/**'

jobs:
  check-resources:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run data generation
        run: ./gradlew runDatagen
      - name: check for changes
        run: |
          # Check if any files changed after running the task
          if [[ -n $(git status --porcelain) ]]; then
            echo "ERROR: Running './gradlew runDatagen' caused changes in the repository."
            echo "Please run './gradlew runDatagen' locally and commit the changes."
            git --no-pager diff
            exit 1
          else
            echo "No changes detected. Data generation is up to date."
          fi
