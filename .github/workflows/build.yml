# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  pull_request:
  push:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x :fabric:runGameTest -x :neoforge:runGameTest

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            common/build/libs/
            fabric/build/libs/
            neoforge/build/libs/

  gametest-fabric:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Fabric game tests
        run: ./gradlew :fabric:runGameTest

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-gametest-fabric
          path: |
            **/build/reports/
            **/build/test-results/

  gametest-neoforge:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run NeoForge game tests
        run: ./gradlew :neoforge:runGameTest

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-gametest-neoforge
          path: |
            **/build/reports/
            **/build/test-results/